name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            targets: '@electron-forge/maker-squirrel,@electron-forge/maker-zip'
          - os: macos-14
            platform: darwin
            arch: arm64
            targets: '@electron-forge/maker-dmg,@electron-forge/maker-zip'
          - os: macos-15-intel
            platform: darwin
            arch: x64
            targets: '@electron-forge/maker-dmg,@electron-forge/maker-zip'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run type-check
      - name: Verify resize requirements
        run: npm run test:resize-requirements
      - name: Verify PDF compression
        run: npm run test:pdf
      - name: Verify installer configuration
        run: node tests/release-config.cjs
      - name: Build installers
        run: npm run make -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --targets=${{ matrix.targets }}
      - name: Verify bundled PDF runtime
        # Run the bundled WASM on every OS before publishing its installers.
        run: node scripts/verify-pdf-runtime.cjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Prepare release assets
        run: node scripts/prepare-release.cjs ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  release:
    name: Publish installers
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: release/
      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum * > ../SHA256SUMS
          mv ../SHA256SUMS .
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag \
              --title "LocalSqueeze $RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md
          fi
